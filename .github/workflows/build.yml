name: Build

# Every push to main builds Windows and Mac and publishes a numbered GitHub release; the apps update
# themselves from it. Version number = run number.
#
# Trust: the release manifest (manifest.txt: version + file hashes) is signed with the project's
# signing key (MAC_SIGN_P12, which also signs the Mac app); the apps only install updates carrying
# this signature. Forks and pull requests cannot trigger this workflow (no access to secrets).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AYNA_BUILD: ${{ github.run_number }}

jobs:
  windows:
    name: Windows (Ayna Merkezi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Test
        run: cargo test --release --locked
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked
          cp target/release/iphone-ayna.exe iPhoneAyna.exe
      # Ready-to-run package: the app plus the AirPlay receiver and video decoder it needs (bin/uxplay),
      # taken from a pinned uxplay-windows release and checked against its SHA-256.
      - name: Package (app + UxPlay)
        shell: bash
        env:
          UXPLAY_URL: https://github.com/leapbtw/uxplay-windows/releases/download/2.0.0.1736/uxplay-windows.zip
          UXPLAY_SHA256: 9d3a51c15fc9db857351195e7eb7bbb21700d9ae25d936a54bcf8536b62cca18
        run: |
          curl -fsSL -o uxplay.zip "$UXPLAY_URL"
          echo "$UXPLAY_SHA256  uxplay.zip" | sha256sum -c -
          mkdir -p AynaMerkezi/bin/uxplay
          7z x -y uxplay.zip -oAynaMerkezi/bin/uxplay > /dev/null
          test -f AynaMerkezi/bin/uxplay/uxplay-windows.exe
          cp iPhoneAyna.exe AynaMerkezi/
          7z a -tzip -mx=7 AynaMerkezi-Windows.zip AynaMerkezi > /dev/null
          ls -la AynaMerkezi-Windows.zip
      # Installer: per-user install (no admin) with a Programs and Features entry; see installer/AynaMerkezi.iss.
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          & $iscc /Qp "/DAppVer=$env:AYNA_BUILD" installer\AynaMerkezi.iss
          if ($LASTEXITCODE) { exit 1 }
          Get-Item AynaMerkezi-Setup.exe | Format-List Name, Length
      # Install silently, check files and the uninstall entry, then uninstall and check that it is gone.
      - name: Installer smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Ayna Merkezi'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{15E0CF97-DA98-430C-BCFB-369CC239E8A0}_is1'
          $p = Start-Process .\AynaMerkezi-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=setup.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "setup exit code $($p.ExitCode)" }
          foreach ($f in 'iPhoneAyna.exe', 'bin\uxplay\uxplay-windows.exe', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          $u = Get-ItemProperty $key
          "$($u.DisplayName) $($u.DisplayVersion) -> $($u.InstallLocation)"
          if ($u.DisplayVersion -ne $env:AYNA_BUILD) { throw 'wrong DisplayVersion' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Ayna Merkezi.lnk'))) { throw 'no Start menu shortcut' }
          $p = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exit code $($p.ExitCode)" }
          for ($i = 0; $i -lt 60 -and ((Test-Path $dir) -or (Test-Path $key)); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir; throw 'install folder left behind' }
          if (Test-Path $key) { throw 'uninstall entry left behind' }
          'install + uninstall OK'
      - uses: actions/upload-artifact@v4
        with:
          name: AynaMerkezi-windows
          path: |
            iPhoneAyna.exe
            AynaMerkezi-Windows.zip
            AynaMerkezi-Setup.exe

  mac:
    name: macOS (Ayna Ajan)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, sign and package
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: sh mac-agent/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AynaAjan-mac
          path: |
            mac-agent/build/AynaAjan.dmg
            mac-agent/build/AynaAjan.zip

  release:
    name: Publish release
    needs: [windows, mac]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign manifest
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          cd dist
          umask 077
          printf '%s' "$MAC_SIGN_P12" | base64 --decode > sign.p12
          openssl pkcs12 -in sign.p12 -nocerts -nodes -legacy -passin env:MAC_SIGN_PASSWORD -out key.pem
          openssl pkcs12 -in sign.p12 -nokeys -legacy -passin env:MAC_SIGN_PASSWORD | openssl x509 -pubkey -noout > pub.pem
          rm -f sign.p12
          { echo "AYNA-SURUM ${AYNA_BUILD}"; sha256sum iPhoneAyna.exe AynaMerkezi-Setup.exe AynaMerkezi-Windows.zip AynaAjan.zip AynaAjan.dmg; } > manifest.txt
          openssl dgst -sha256 -sign key.pem -out manifest.bin manifest.txt
          rm -f key.pem
          openssl dgst -sha256 -verify pub.pem -signature manifest.bin manifest.txt
          od -An -tx1 -v manifest.bin | tr -d ' \n' > manifest.sig
          rm -f manifest.bin pub.pem
          cat manifest.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          {
            echo "Ayna Merkezi (Windows) and Ayna Ajan (Mac), version ${AYNA_BUILD}."
            echo
            echo "- Windows: download and run **AynaMerkezi-Setup.exe** (no admin rights needed; uninstall from Control Panel > Programs and Features). Portable alternative: extract AynaMerkezi-Windows.zip and run iPhoneAyna.exe from it. iPhoneAyna.exe alone is the update file."
            echo "- Mac: AynaAjan.dmg"
            echo
            echo "Installed apps update themselves. Signed manifest (SHA-256):"
            echo
            sed 's/^/    /' manifest.txt
          } > notes.md
          gh release create "v${AYNA_BUILD}" AynaMerkezi-Setup.exe AynaMerkezi-Windows.zip iPhoneAyna.exe AynaAjan.zip AynaAjan.dmg manifest.txt manifest.sig \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Version ${AYNA_BUILD}" --notes-file notes.md
