name: Derleme

# Her main gönderiminde Windows ve Mac derlenir, numaralı bir GitHub sürümü yayınlanır; uygulamalar
# kendilerini bu sürümden günceller. Sürüm numarası = çalıştırma numarası.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  AYNA_BUILD: ${{ github.run_number }}

jobs:
  windows:
    name: Windows (Ayna Merkezi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust araç zinciri
        run: rustup toolchain install stable --profile minimal
      - name: Test
        run: cargo test --release
      - name: Derle
        shell: bash
        run: |
          cargo build --release
          cp target/release/iphone-ayna.exe iPhoneAyna.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AynaMerkezi-windows
          path: iPhoneAyna.exe

  mac:
    name: macOS (Ayna Ajan)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derle, imzala ve paketle
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: sh mac-agent/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AynaAjan-mac
          path: |
            mac-agent/build/AynaAjan.dmg
            mac-agent/build/AynaAjan.zip

  release:
    name: Sürüm yayınla
    needs: [windows, mac]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum iPhoneAyna.exe AynaAjan.zip AynaAjan.dmg > SHA256SUMS.txt
          gh release create "v${AYNA_BUILD}" iPhoneAyna.exe AynaAjan.zip AynaAjan.dmg SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Sürüm ${AYNA_BUILD}" --notes-file SHA256SUMS.txt
